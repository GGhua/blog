name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  Update-FixIt:
    runs-on: ubuntu-latest
    permissions:
      #允许 push 到仓库
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "GGhua"
          git config --global user.email "48508169+GGhua@users.noreply.github.com"

      - name: Update theme
        run: git submodule update --remote --merge themes/FixIt

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_user_name: Cell[bot]
          commit_user_email: 48508169+GGhua@users.noreply.github.com
          commit_author: Cell[bot] <48508169+GGhua@users.noreply.github.com>
          commit_message: 'chore(deps): update theme and components version'
          # commit_message: ':arrow_up: Chore(theme): update FixIt version'
          # commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
